services:
  mongodb:
    image: mongo:7.0
    container_name: polygon-annotator-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: polygon_annotator
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 5s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: polygon-annotator-backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      DATABASE_NAME: polygon_annotator
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polygon-annotator-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  mongo_data:

networks:
  default:
    name: polygon-annotator-network
